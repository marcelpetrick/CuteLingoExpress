[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cutelingoexpress"
dynamic = ["version"]
description = "Translate Qt TS files and preserve structure for review."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
  "translators==6.0.4",
]

[project.optional-dependencies]
yaml = [
  "ruamel.yaml==0.19.1",
]
dev = [
  "build==1.6.1",
  "coverage[toml]==7.16.1",
  "pylint==4.0.8",
]

[project.scripts]
cutelingoexpress = "auto_trans:main"

[tool.setuptools]
py-modules = ["auto_trans", "auto_trans_yaml", "ts_xml", "version"]

[tool.setuptools.dynamic]
version = {attr = "version.VERSION"}

[tool.coverage.run]
branch = true
source = ["auto_trans", "auto_trans_yaml", "ts_xml", "version"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"
