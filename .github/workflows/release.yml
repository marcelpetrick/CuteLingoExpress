name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,yaml]"

      - name: Pylint
        run: >-
          python -m pylint auto_trans.py auto_trans_yaml.py test_auto_trans.py
          test_auto_trans_yaml.py version.py

      - name: Tests with coverage
        run: |
          python -m coverage run -m unittest
          python -m coverage report -m

      - name: Read version
        id: version
        run: |
          VERSION=$(python -c "import version; print(version.VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists — bump the version before releasing."
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Create and push tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CuteLingoExpress ${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
